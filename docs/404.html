        return page && page.go && hops < 2 ? find(page.go, hops + 1) : page;
      });
    };

    find(slug, 0).then(function (page) {
      if (page) {
        document.documentElement.classList.add('bare');
        ['copy', 'cut', 'paste', 'contextmenu', 'dragstart', 'selectstart'].forEach(function (ev) {
          document.addEventListener(ev, function (e) {
            var inField = e.target && e.target.tagName === 'INPUT';
            if (ev === 'selectstart' && inField) return;
            if (ev === 'selectstart') { var se = e.target && (e.target.nodeType === 1 ? e.target : e.target.parentElement); if (se && se.closest && se.closest('.pg-sel')) return; }
            e.preventDefault();
          });
        });
        try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('pg:') === 0) localStorage.removeItem(k); }); } catch (e) {}
        var chain = [];
        var paint = function (p) { document.title = p.title; document.getElementById('main').innerHTML = p.html; done(); };
        var replay = function (p, i) {
          if (!p.x || i >= chain.length) { paint(p); hooks(p, i); return; }
          (p.x.w ? unwrap(p.x, chain[i]) : reveal(p.x, chain[i])).then(function (next) { replay(next, i + 1); }, function () { keep(chain.slice(0, i)); paint(p); hooks(p, i); });
        };
        replay(page, 0);
      } else {
        document.title = 'Page not found · Luke D. Visconte';
        done();
      }
    }, done);
  })();
  </script>
